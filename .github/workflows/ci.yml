name: CI/CD React Modern

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: react-lint-ci-cd/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: react-lint-ci-cd

      - name: Run ESLint
        run: npm run lint
        working-directory: react-lint-ci-cd

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: react-lint-ci-cd/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: react-lint-ci-cd

      - name: Run tests
        run: npm run test -- --coverage --run
        working-directory: react-lint-ci-cd

  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: react-lint-ci-cd/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: react-lint-ci-cd

      - name: Run security audit
        run: npm audit --audit-level=high
        working-directory: react-lint-ci-cd

  build:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: react-lint-ci-cd/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: react-lint-ci-cd

      - name: Build
        run: npm run build
        working-directory: react-lint-ci-cd

      - name: Upload production-ready build
        uses: actions/upload-pages-artifact@v3
        with:
          path: react-lint-ci-cd/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4